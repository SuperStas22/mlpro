# Порт 80 компьютера ведёт в NodePort Traefik внутри единственного узла kind.
# Этот проброс задаётся при создании кластера и позже без пересоздания не меняется.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"

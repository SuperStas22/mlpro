name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: logp}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/logp

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    # Только локальный runner находится в Docker-сети kind и видит постоянный кластер.
    runs-on: [self-hosted, kind]
    concurrency: {group: deploy-kind}
    timeout-minutes: 10
    permissions: {contents: read, packages: read}
    env:
      KIND_CLUSTER: logp

    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Connect runner to kind
        run: |
          BIN="$HOME/.local/bin"
          mkdir -p "$BIN"
          echo "$BIN" >> "$GITHUB_PATH"
          test -x "$BIN/kind" || curl -sSLo "$BIN/kind" https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          test -x "$BIN/kubectl" || curl -sSLo "$BIN/kubectl" https://dl.k8s.io/v1.37.0/bin/linux/amd64/kubectl
          chmod +x "$BIN/kind" "$BIN/kubectl"
          "$BIN/kind" export kubeconfig --name "$KIND_CLUSTER" --internal
          "$BIN/kubectl" get nodes

      - name: Load image into kind
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"

      - name: Create application secret
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          test -n "$DB_PASSWORD"
          kubectl create secret generic logp-secrets \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/logp" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy PostgreSQL
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deployment/postgres --timeout=180s
      - name: Deploy service
        run: |
          kubectl apply -f k8s/configmap.yaml -f k8s/service.yaml -f k8s/deployment.yaml
          kubectl set image deployment/logp-service api="$IMAGE"
          kubectl rollout status deployment/logp-service --timeout=180s

      - name: Smoke test
        run: |
          # Runner находится в сети kind: обращаемся к NodePort Traefik с нужным Host.
          URL="http://$KIND_CLUSTER-control-plane:30080"
          HOST="Host: logp.localhost"

          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            -H "$HOST" "$URL/health" | tee /tmp/health.json
          grep -Eq '"model_version":"logp-model-v[0-9]+"' /tmp/health.json
          grep -q '"log_level":"INFO"' /tmp/health.json

          curl --fail --silent --show-error -X POST -H "$HOST" "$URL/v1/predict" \
            -H "Content-Type: application/json" -d @good.json | tee /tmp/prediction.json
          jq -e '.logp >= -10 and .logp <= 15 and (.lipinski_ok | type == "boolean")' \
            /tmp/prediction.json >/dev/null

          REQUEST_ID=$(jq -r .request_id /tmp/prediction.json)
          # BackgroundTask пишет лог после ответа, поэтому ждём только свою строку не более 20 секунд.
          LOG_FOUND=0
          for ATTEMPT in $(seq 1 20); do
            if kubectl exec deployment/postgres -- psql -U postgres -d logp -tAc \
              "SELECT count(*) FROM predictions WHERE request_id = '$REQUEST_ID' AND status_code = 200" | grep -qx 1; then
              LOG_FOUND=1
              break
            fi
            sleep 1
          done
          test "$LOG_FOUND" -eq 1
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl describe pods || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl logs deployment/postgres --all-containers --tail=100 || true
          kubectl logs deployment/logp-service --all-containers --tail=100 || true
          kubectl logs deployment/logp-service --all-containers --previous --tail=100 || true
          kubectl get ingress -A || true
